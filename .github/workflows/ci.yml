name: CI

on:
    push:
        branches: ['**']

permissions:
    id-token: write
    contents: write
    actions: read
    checks: read
    deployments: write
    artifact-metadata: write

jobs:
    spec:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # The spec ships no binary, so buildhost has nothing to publish.
            - uses: wow-look-at-my/go-toolchain@master
              with:
                  autorelease: 'false'
