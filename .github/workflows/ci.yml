name: CI

on:
    push:
        branches: ['**']

jobs:
    spec:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # The suite is TypeScript, which node runs directly from 22.18 on.
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: install xml-validator
              run: |
                  curl -fsSL https://apt.pazer.build/xml-validator/install.sh | sudo sh
                  sudo apt-get install -y xml-validator

            - run: node tools/check.ts
