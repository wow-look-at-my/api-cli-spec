name: CI

on:
    push:
        branches: ['**']

jobs:
    spec:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # dats sandboxes every test command, and bubblewrap is the backend
            # it reaches for first. Without one it refuses to run at all.
            - run: sudo apt-get update && sudo apt-get install -y bubblewrap

            - name: install xml-validator and dats
              run: |
                  curl -fsSL https://apt.pazer.build/xml-validator/install.sh | sudo sh
                  curl -fsSL https://apt.pazer.build/dats/install.sh | sudo sh
                  sudo apt-get install -y xml-validator dats

            - run: dats dats/
